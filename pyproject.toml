[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "langchain-schemagate"
version = "0.1.0"
description = "LangChain retriever that sends a text-to-SQL model only the tables a question needs, from the ones the caller may read"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ashish Sinha" }]
requires-python = ">=3.10"
dependencies = ["schemagate>=1.14", "langchain-core>=0.3"]
keywords = ["langchain", "text-to-sql", "nl2sql", "schema-selection", "retriever", "access-control"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests>=0.3"]

[project.urls]
Homepage = "https://github.com/ashishsinha1602/langchain-schemagate"
Documentation = "https://github.com/ashishsinha1602/schemagate/blob/main/docs/langchain.md"
"schemagate" = "https://github.com/ashishsinha1602/schemagate"

[tool.hatch.build.targets.wheel]
packages = ["langchain_schemagate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
